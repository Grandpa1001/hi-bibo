<title>Bibotektyw</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap">
<style>
/* Style guide Bibo: czarny #000, biały #FFF, turkus #009688, szary #F2F2F2, Roboto. */
:root{
  color-scheme: light;
  --black:#000000; --white:#FFFFFF; --grey:#F2F2F2; --grey-2:#E3E3E3; --grey-3:#C9C9C9;
  --teal:#009688; --teal-h:#00897B; --teal-a:#00796B; --teal-50:#E0F2F1; --teal-100:#B2DFDB;
  --ink:#111111; --muted:#5E5E5E; --faint:#8A8A8A;
  --tg-bg:#D5E3CC; --tg-in:#FFFFFF; --tg-out:#E1FFC7; --tg-time:#9AA59A; --tg-out-time:#6FA15B; --tg-head:#FFFFFF;
  --sans:"Roboto",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Roboto Mono",ui-monospace,Menlo,monospace;
  --comic:2px solid var(--black);
}
html,body{height:auto}
body{background:var(--grey);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:28px 48px}
.wrap{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:40px;align-items:start}
@media (max-width:860px){.wrap{grid-template-columns:1fr;gap:28px}}

/* ---------- intro / notes ---------- */
.intro{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;border-bottom:var(--comic);padding-bottom:18px}
.intro img{width:64px;height:64px;border-radius:50%;flex:none}
.intro h1{font-weight:900;font-size:clamp(28px,5vw,40px);line-height:1;margin:0;letter-spacing:-.01em;color:var(--black)}
.intro h1 span{color:var(--teal)}
.intro p{margin:0;color:var(--muted);max-width:60ch;flex:1 1 320px}
.nav{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.nav button{font:500 12.5px/1 var(--sans);color:var(--ink);background:var(--white);border:var(--comic);border-radius:8px;padding:8px 11px;cursor:pointer}
.nav button:hover{background:var(--grey-2)}
.nav button[aria-current="true"]{color:var(--white);background:var(--teal);border-color:var(--teal)}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--teal-100);outline-offset:2px}

.notes{position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px);display:grid;gap:18px}
.notes .step{font:700 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.notes h2{font-weight:700;font-size:26px;line-height:1.2;margin:6px 0 0;color:var(--teal);text-wrap:balance}
.notes .lead{margin:0;max-width:60ch}
.who{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:500 12.5px/1 var(--sans);padding:7px 10px;border-radius:8px}
.chip.code{border:var(--comic);background:var(--white)}
.chip.llm{background:var(--teal);color:var(--white)}
.chip.tg{background:var(--grey-2);color:var(--ink)}
.chip.zero{border:2px solid var(--teal);color:var(--teal-a);background:var(--teal-50)}
.notes ul{margin:0;padding-left:18px;display:grid;gap:8px;color:var(--muted);max-width:62ch}
.notes ul b{color:var(--ink);font-weight:700}
.notes code{font-family:var(--mono);font-size:12px;color:var(--teal-a);background:var(--white);border:1px solid var(--grey-2);padding:1px 5px;border-radius:4px}
.cost{border-top:var(--comic);padding-top:14px;display:flex;flex-wrap:wrap;gap:24px;font-variant-numeric:tabular-nums}
.cost div{display:grid;gap:2px}
.cost span{font:700 11px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.cost strong{font-size:20px;font-weight:900}

/* ---------- phone ---------- */
.phone{position:relative;width:100%;max-width:400px;height:760px;border-radius:40px;background:var(--black);padding:10px;box-shadow:8px 8px 0 var(--teal)}
.screen{position:relative;height:100%;border-radius:31px;overflow:hidden;background:var(--tg-bg);display:flex;flex-direction:column}
.status{height:30px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font:700 12px/1 var(--sans);color:var(--black);background:var(--tg-head)}

/* chat (Telegram, motyw jasny) */
.chat-head{flex:none;display:flex;align-items:center;gap:10px;padding:6px 14px 10px;background:var(--tg-head);border-bottom:1px solid var(--grey-2)}
.chat-head img{width:38px;height:38px;border-radius:50%}
.chat-head .n{font-weight:700;font-size:15px}
.chat-head .s{font-size:12px;color:var(--faint)}
.chat{flex:1;overflow-y:auto;padding:14px 10px;display:flex;flex-direction:column;gap:6px;
  background-image:radial-gradient(rgba(0,0,0,.05) 1px,transparent 1.5px);background-size:18px 18px}
.msg{max-width:84%;padding:7px 11px 6px;border-radius:14px;font-size:14.5px;line-height:1.4;box-shadow:0 1px 1px rgba(0,0,0,.12)}
.msg.in{background:var(--tg-in);align-self:flex-start;border-bottom-left-radius:4px}
.msg.out{background:var(--tg-out);align-self:flex-end;border-bottom-right-radius:4px}
.msg .t{display:block;text-align:right;font-size:11px;color:var(--tg-time);margin-top:2px}
.msg.out .t{color:var(--tg-out-time)}
.kb{align-self:flex-start;width:84%;display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:-2px}
.kb button{font:500 13.5px var(--sans);color:var(--white);border:0;border-radius:10px;padding:9px 6px;cursor:pointer;background:rgba(58,78,62,.55)}
.kb button.success{background:var(--teal)}
.kb button:disabled{opacity:.45;cursor:default}
.case-card{align-self:flex-start;width:84%;background:var(--tg-in);border-radius:14px;border-bottom-left-radius:4px;overflow:hidden;font-size:14px;box-shadow:0 1px 1px rgba(0,0,0,.12)}
.case-card .pic{display:flex;align-items:end;justify-content:space-between;background:var(--teal-50);border-bottom:var(--comic);padding:8px 12px 0}
.case-card .pic img{height:96px;mix-blend-mode:multiply}
.case-card .pic span{font:700 12px var(--mono);padding-bottom:10px}
.case-card .bd{padding:9px 12px 8px;display:grid;gap:6px}
.case-card .verdict{font-weight:900;letter-spacing:.04em;color:var(--teal-a)}
.case-card .t{text-align:right;font-size:11px;color:var(--tg-time)}
.sys{align-self:center;font-size:12px;color:var(--white);background:rgba(58,78,62,.5);padding:4px 10px;border-radius:999px;margin-block:6px;text-align:center;max-width:90%}
.inputbar{flex:none;display:flex;gap:8px;align-items:center;padding:8px 10px 14px;background:var(--tg-head);border-top:1px solid var(--grey-2)}
.menu-btn{flex:none;font:700 13px var(--sans);color:var(--white);background:var(--teal);border:0;border-radius:8px;padding:9px 11px;cursor:pointer}
.fake-input{flex:1;color:var(--faint);font-size:14px;padding:9px 4px}

/* mini app shell */
.app{position:absolute;inset:0;top:30px;background:var(--grey);display:flex;flex-direction:column;transition:transform .38s cubic-bezier(.2,.8,.2,1)}
.app[hidden]{display:flex!important;transform:translateY(105%);pointer-events:none}
.app-head{flex:none;display:flex;align-items:center;justify-content:space-between;padding:8px 14px;font-weight:700;font-size:14px;background:var(--white);border-bottom:var(--comic)}
.app-head button{font:500 13px var(--sans);color:var(--ink);background:var(--grey);border:0;border-radius:8px;padding:6px 10px;cursor:pointer}
.app-body{flex:1;overflow-y:auto;padding:16px 16px;display:flex;flex-direction:column;gap:14px}
.mainbar{flex:none;display:grid;gap:8px;padding:10px 14px 16px;background:var(--white);border-top:1px solid var(--grey-2)}
.mainbtn{font:700 15px var(--sans);color:var(--white);background:var(--teal);border:0;border-radius:8px;padding:14px;cursor:pointer;box-shadow:0 2px 4px rgba(0,0,0,.15)}
.mainbtn:hover{background:var(--teal-h)} .mainbtn:active{background:var(--teal-a)}
.mainbtn.sec{background:var(--white);color:var(--ink);border:var(--comic);box-shadow:none}
.mainbtn.sec:hover{background:var(--teal-100)}
.mainbtn.sec:disabled{background:var(--teal-50);color:var(--teal-a);border-color:var(--teal);opacity:1}
.mainbtn:disabled{cursor:default}
.tg-note{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);text-align:center}

/* komiksowe karty */
.panel{background:var(--white);border:var(--comic);border-radius:14px;box-shadow:4px 4px 0 var(--black);padding:14px 16px}
.case-label{display:flex;justify-content:space-between;gap:8px;font:700 11.5px/1.2 var(--mono);letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
h3{font-weight:700;font-size:22px;line-height:1.2;margin:6px 0 0;color:var(--teal)}
.panel p{margin:8px 0 0}
textarea{width:100%;box-sizing:border-box;font:16px/1.45 var(--sans);color:var(--ink);background:var(--white);border:var(--comic);border-radius:8px;padding:10px 12px;resize:none;min-height:92px}
label.lbl{display:block;font:700 11px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.hint{font-size:13px;color:var(--muted);margin:0}

/* hub */
.hero{display:grid;grid-template-columns:1fr 130px;align-items:end;gap:6px}
.hero h2{font-weight:900;font-size:27px;line-height:1.1;margin:0;color:var(--black)}
.hero h2 span{color:var(--teal)}
.hero p{margin:6px 0 0;color:var(--muted);font-size:14px}
.hero img{width:130px;mix-blend-mode:multiply;justify-self:end}
.modes{display:grid;gap:10px}
.mode{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--white);border:var(--comic);border-radius:14px;padding:10px 12px;color:var(--ink);cursor:pointer;font:inherit}
.mode.on{box-shadow:4px 4px 0 var(--teal)}
.mode .ic{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;font-size:24px;background:var(--grey);overflow:hidden}
.mode .ic img{width:52px;height:52px;object-fit:cover;object-position:50% 12%}
.mode b{display:block;font-size:15.5px}
.mode small{color:var(--muted);font-size:13px}
.mode .tag{font:700 11px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1.5px solid var(--grey-3);border-radius:8px;padding:6px 8px}
.mode.on .tag{color:var(--white);background:var(--teal);border-color:var(--teal)}
.mode:disabled{cursor:default;border-color:var(--grey-3);color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-variant-numeric:tabular-nums}
.stats div{background:var(--white);border-radius:12px;padding:10px;display:grid;gap:2px;border:1px solid var(--grey-2)}
.stats strong{font-size:22px;font-weight:900;color:var(--teal)}
.stats span{font-size:11.5px;color:var(--muted);line-height:1.3}

/* postać + dymek */
.speaker{display:grid;grid-template-columns:96px 1fr;gap:6px;align-items:end}
.speaker img{width:96px;mix-blend-mode:multiply}
.bubble{position:relative;background:var(--white);border:var(--comic);border-radius:16px;padding:12px 14px;margin-bottom:34px}
.bubble::after{content:"";position:absolute;left:-11px;bottom:14px;width:18px;height:18px;background:var(--white);border-left:var(--comic);border-bottom:var(--comic);transform:rotate(45deg) skew(8deg,8deg)}
.bubble p{margin:0;font-size:16px;line-height:1.4;font-weight:500}
.bubble small{display:block;font:700 10.5px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--teal);margin-bottom:6px}

/* podejrzany */
.suspect{display:grid;grid-template-columns:88px 1fr;gap:14px;align-items:center}
.mug{position:relative;height:104px;border:var(--comic);border-radius:8px;overflow:hidden;background:
  repeating-linear-gradient(to bottom,transparent 0 17px,rgba(0,0,0,.14) 17px 18px),var(--grey);display:grid;place-items:end center}
.mug .face{font-size:44px;line-height:1;margin-bottom:24px}
.mug .no{position:absolute;left:0;right:0;bottom:0;background:var(--black);color:var(--white);font:700 10.5px/1.8 var(--mono);text-align:center;letter-spacing:.06em}
.rap{display:grid;gap:2px;font-size:13px;color:var(--muted)}
.rap b{font-weight:900;font-size:19px;color:var(--black);line-height:1.2}
.rap .pill{justify-self:start;margin-top:4px;font:700 11px/1 var(--sans);color:var(--teal-a);background:var(--teal-50);border:1.5px solid var(--teal);border-radius:6px;padding:5px 7px}
blockquote{margin:12px 0 0;padding:8px 12px;border-left:4px solid var(--teal);background:var(--grey);font-size:14.5px;font-style:italic;border-radius:0 8px 8px 0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn2{font:500 14px var(--sans);color:var(--ink);background:var(--white);border:var(--comic);border-radius:8px;padding:11px 8px;cursor:pointer}
.btn2:hover{background:var(--teal-100)}
.btn2:disabled{background:var(--teal-50);color:var(--teal-a);border-color:var(--teal);cursor:default}

/* loading */
.loading{flex:1;display:grid;place-items:center;text-align:center;padding:20px}
.loading .who-think{position:relative;display:grid;justify-items:center;gap:10px}
.loading img{width:170px;mix-blend-mode:multiply}
.think{position:absolute;right:-26px;top:-18px;background:var(--white);border:var(--comic);border-radius:24px;padding:8px 14px;font:700 16px var(--sans)}
.think::before,.think::after{content:"";position:absolute;background:var(--white);border:var(--comic);border-radius:50%}
.think::before{width:12px;height:12px;left:10px;bottom:-16px}
.think::after{width:7px;height:7px;left:2px;bottom:-26px}
.dots span{display:inline-block;animation:dot 1.1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
.loading p{margin:0;font-weight:700;font-size:19px;color:var(--teal)}
.loading small{color:var(--muted)}

/* verdict */
.verdict-hero{position:relative;display:grid;justify-items:center;padding-top:4px}
.verdict-hero img{width:170px;mix-blend-mode:multiply;animation:hop .7s cubic-bezier(.3,1.5,.5,1) both}
@keyframes hop{0%{transform:translateY(30px) scale(.9);opacity:0}100%{transform:none;opacity:1}}
.stamp{position:absolute;right:4px;top:18px;transform:rotate(-12deg);font:900 24px/1 var(--sans);letter-spacing:.06em;color:var(--teal);border:4px solid var(--teal);border-radius:8px;padding:7px 10px;background:rgba(255,255,255,.7);animation:stamp .5s cubic-bezier(.3,1.6,.4,1) both;animation-delay:.35s}
.stamp.dark{color:var(--black);border-color:var(--black)}
@keyframes stamp{0%{transform:rotate(-12deg) scale(2.4);opacity:0}100%{transform:rotate(-12deg) scale(1);opacity:1}}
.summary{font-size:16px;line-height:1.45;margin:0}
.step-card{display:grid;grid-template-columns:1fr 92px;gap:8px;align-items:center;background:var(--teal);color:var(--white);border:var(--comic);border-radius:14px;box-shadow:4px 4px 0 var(--black);padding:12px 8px 12px 14px}
.step-card span{font:700 11px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.step-card p{margin:6px 0 0;font-size:16.5px;font-weight:700;line-height:1.3}
.step-card img{width:92px;background:var(--white);border-radius:10px;border:var(--comic)}
.haptic{align-self:center;font:700 10.5px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);border:1.5px dashed var(--grey-3);border-radius:8px;padding:6px 10px}
.shake{animation:shake .35s ease}
@keyframes shake{25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}

/* kartoteka */
.board-head{display:grid;grid-template-columns:1fr 92px;align-items:end;gap:6px}
.board-head h2{font-weight:900;font-size:26px;margin:0;line-height:1.1}
.board-head p{margin:6px 0 0;color:var(--muted);font-size:14px}
.board-head img{width:92px;mix-blend-mode:multiply}
.board{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.file{position:relative;background:var(--white);border:var(--comic);border-radius:10px;padding:14px 10px 10px;display:grid;gap:3px;transform:rotate(var(--r,0deg));box-shadow:3px 3px 0 var(--black)}
.file::before{content:"";position:absolute;top:-7px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--teal);border:2px solid var(--black)}
.file .e{font-size:24px}
.file b{font-size:14px;line-height:1.2}
.file small{font:500 11.5px var(--mono);color:var(--muted)}
.bars{display:flex;gap:3px;margin-top:3px}
.bars i{width:9px;height:9px;border-radius:2px;background:var(--black)}
.bars i.ok{background:var(--teal)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}

/* popup (showPopup) */
.popup{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.4);padding:26px;z-index:5}
.popup[hidden]{display:none!important}
.popup .box{background:var(--white);border:var(--comic);border-radius:14px;box-shadow:4px 4px 0 var(--black);padding:16px;display:grid;gap:10px;max-width:300px}
.popup .box b{font-size:15px}
.popup .box p{margin:0;color:var(--muted);font-size:14px}
.popup .box button{justify-self:end;font:700 14px var(--sans);color:var(--white);background:var(--teal);border:0;border-radius:8px;cursor:pointer;padding:8px 16px}

/* confetti */
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:6}
.fx i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(780px) rotate(540deg);opacity:.2}}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}
}
</style>

<div class="wrap">
  <header class="intro">
    <img src="assets/logo.png" alt="Logo Bibo">
    <h1>Bibo<span>tektyw</span></h1>
    <p>Klikalny prototyp Mini App w stylu Bibo. Przejdź sprawę od propozycji w czacie do powrotu z wynikiem. Pola tekstowe możesz zmienić, odpowiedzi „Haiku” są tu udawane.</p>
  </header>

  <nav class="nav" id="nav" aria-label="Ekrany prototypu"></nav>

  <div class="phone" aria-label="Podgląd telefonu">
    <div class="screen" id="screen">
      <div class="status"><span>21:47</span><span>●●● 5G ▮</span></div>

      <div class="chat-head">
        <img src="assets/logo.png" alt="">
        <div><div class="n">Bibo</div><div class="s">bot</div></div>
      </div>
      <div class="chat" id="chat"></div>
      <div class="inputbar">
        <button class="menu-btn" id="menuBtn" type="button">🎲 Tryby</button>
        <div class="fake-input">Wiadomość</div>
      </div>

      <section class="app" id="app" hidden aria-label="Mini App">
        <div class="app-head">
          <button type="button" id="closeApp">✕ Zamknij</button>
          <span id="appTitle">Bibotektyw</span>
          <button type="button" id="backBtn">‹ Wstecz</button>
        </div>
        <div class="app-body" id="body"></div>
        <div class="mainbar" id="mainbar"></div>
      </section>

      <div class="popup" id="popup" hidden role="dialog" aria-modal="true">
        <div class="box"><b id="popT"></b><p id="popP"></p><button type="button" id="popOk">OK</button></div>
      </div>
      <div class="fx" id="fx"></div>
    </div>
  </div>

  <aside class="notes" id="notes" aria-live="polite"></aside>
</div>

<script>
(function(){
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const IMG = n => `assets/${n}.png`;

const S = {
  excuse: "Muszę najpierw zrobić idealny research front-endu i GSAP, inaczej nie ruszam w ogóle kodu strony.",
  rebuttal: "Bo mogę postawić szkielet i mockupy teraz, a animacje dodać w kolejnym sprincie bez blokowania reszty.",
  suspect: null, verdict: null, acquit: false, hintUsed: false, returned: false, offerClicked: false
};

const SUSPECTS = {
  perf: {name:"Perfekcjonista", face:"🎩", count:3, q:"Jaka wersja na 60% przydałaby się już dziś, nawet bez GSAP?", hint:"Szkielet i mockup nie blokują animacji. Te mogą dojść później."},
  jutro:{name:"Jutrzejszy Ja", face:"📅", count:2, q:"Co takiego będzie jutro, czego nie ma teraz? Konkretnie.", hint:"Jutro masz te same 24 godziny i o jedną sprawę więcej."},

function classify(t){
  t=t.toLowerCase();
  if(/research|idealn|perfek|najpierw/.test(t)) return "perf";
  if(/jutr|później|potem|wieczorem/.test(t)) return "jutro";
  if(/zmęcz|siły|sil |padam|wykończ/.test(t)) return "paliwo";
  return "mgla";
}

function haptic(kind){
  try{ navigator.vibrate && navigator.vibrate(kind==="success"?[30,40,60]:15); }catch(e){}
  const ph = $(".phone"); ph.classList.remove("shake"); void ph.offsetWidth; ph.classList.add("shake");
}
function confetti(){
  const fx = $("#fx"); fx.innerHTML="";
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cols=["#009688","#000000","#B2DFDB","#FFFFFF","#00796B"];
  for(let i=0;i<46;i++){
    const el=document.createElement("i");
    el.style.left=Math.random()*100+"%";
    el.style.background=cols[i%cols.length];
    el.style.border="1px solid #000";
    el.style.animationDelay=(Math.random()*.5)+"s";
    el.style.animationDuration=(1.2+Math.random()*.9)+"s";
    fx.appendChild(el);
  }
  setTimeout(()=>fx.innerHTML="",2600);
}

function makeVerdict(){

  const perf = S.suspect && S.suspect.name==="Perfekcjonista";
  return {acq:false,cls:"",img:"radosc",stamp:"OBALONA",icon:"💥",label:"WYMÓWKA OBALONA",short:"obalona",
    summary: perf ? "Perfekcjonizm to strach przed startem w ładnym płaszczu. Szkielet teraz, animacje w kolejnym sprincie."
                  : "Wymówka nie przetrwała jednego pytania. Nie potrzebujesz całości, żeby ruszyć.",
    step: perf ? "Otwórz repo i utwórz pusty index.html z trzema sekcjami" : "Otwórz plik i napisz pierwsze zdanie, byle jakie"};
}

function openApp(){ $("#app").hidden=false; }
function closeApp(){ $("#app").hidden=true; }
function go(id){
  cur=id;
  if(id==="chat"){ closeApp(); renderChat(); }
  else if(id==="powrot"){
    if(!S.suspect) S.suspect=SUSPECTS[classify(S.excuse)];
    if(!S.verdict) S.verdict=makeVerdict();
    S.returned=true; closeApp(); renderChat();
  } else {
    S.offerClicked = true;
    if(id==="werdykt" && !S.suspect) S.suspect=SUSPECTS[classify(S.excuse)];
    if(id==="werdykt" && !S.verdict) S.verdict=makeVerdict();
    if(id==="load2") S.verdict=null;
    openApp(); renderApp();
  }
  setNav(); renderNotes();
}

document.addEventListener("click", e=>{
  const g = e.target.closest("[data-go]");
  if(g && !g.disabled){ go(g.dataset.go); return; }
  if(e.target.closest("[data-no]")){ S.offerClicked=true; renderChat();
    const c=$("#chat"); c.insertAdjacentHTML("beforeend",`<div class="sys">OK, bez śledztwa dziś. Nie proponuję do jutra.</div>`); c.scrollTop=c.scrollHeight; }
});
$("#menuBtn").onclick=()=>go("hub");
$("#closeApp").onclick=()=>go(S.returned?"powrot":"chat");
$("#backBtn").onclick=()=>{
  const back={zeznanie:"hub",load1:"zeznanie",przes:"zeznanie",load2:"przes",werdykt:"przes",kartoteka:"hub"};
  go(back[cur]||"hub");
};

renderChat(); setNav(); renderNotes();
})();
