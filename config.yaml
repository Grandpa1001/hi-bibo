# Bibo — konfiguracja profilu Hermes
#
# POPRAWIONE 2026-09-21 po realnym teście instalacji: pierwsza wersja tego
# pliku używała zmyślonego schematu (agent.model, plugins.enabled,
# platforms.telegram, cron.jobs) i bardzo prawdopodobnie to ona psuła
# rejestrację profilu w Hermesie (walidacja config.yaml się wywalała).
# Zweryfikowano przeciw prawdziwej dokumentacji:
# https://github.com/NousResearch/hermes-agent/blob/main/website/docs/user-guide/configuration.md
#
# Trzymamy tylko klucze POTWIERDZONE w dokumentacji. Reszta (fallback_chain,
# dokładny format ID modelu, prompt cache) zostaje pominięta świadomie —
# lepiej mniej niż znowu zgadnięty klucz psujący walidację.

model: anthropic/claude-sonnet-4-6
# UWAGA: dokładny identyfikator modelu (czy potrzebuje sufiksu daty, jak
# `claude-opus-4-5-20251101` widoczne w `hermes profile list` dla profilu
# `default`) — do zweryfikowania na żywym Hermesie: `hermes model` albo
# `hermes profile show default` pokaże prawdziwy, działający format.

skills:
  auto_load: []
  # Skill bibo-critical-thinking ładowany na żądanie (progressive
  # disclosure), NIE tutaj — decyzja #17 w Analiza.MD.

# Celowo BRAK sekcji: plugins, platforms.telegram, cron, agent.fallback.
# Powód dla każdej:
#   plugins        — zero pluginów (decyzja #22); dokumentacja nie
#                    potwierdza top-level klucza `plugins`, nie zgadujemy.
#   platforms      — Telegram konfiguruje się przez `hermes gateway setup`
#                    (interaktywnie) + zmienne środowiskowe, NIE tutaj.
#                    Patrz README → sekcja Instalacja.
#   cron           — zadania cron to osobne pliki w profilu, nie klucz
#                    w config.yaml. Bibo i tak jest reaktywny (decyzja #5)
#                    — nie tworzymy żadnych.
#   agent.fallback — prawdziwy mechanizm to `providers.<id>` +
#                    `providers.fallback.fallback_chain`, znacznie
#                    bardziej złożony niż zakładaliśmy. Odłożone do
#                    czasu gdy będzie można to przetestować na żywo.
