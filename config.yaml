# Bibo — konfiguracja profilu Hermes (MVP)
#
# Każda sekcja tu istnieje z jednego powodu: KOSZT i PRZEWIDYWALNOŚĆ.
# Klucze sprawdzone z dokumentacją Hermesa (website/docs/user-guide/configuration.md)
# i zmierzone `hermes prompt-size --platform telegram`. Pomiary: docs/REANALIZA.md.
#
# Uwaga: `hermes profile update` NIE nadpisuje tego pliku (chroni Twoje zmiany).
# Żeby wciągnąć nową wersję: `hermes profile update bibo --force-config`.

model:
  provider: anthropic
  default: claude-sonnet-5          # $2/$10 za 1M tok. Taniej: claude-haiku-4-5 ($1/$5).

# --- Narzędzia: tylko pamięć. -----------------------------------------------
# Domyślnie Telegram dostaje ~24 narzędzia (terminal, przeglądarka, pliki,
# delegacja...) = ~41 KB schematów JSON w KAŻDYM zapytaniu. Bibo rozmawia
# i pamięta — nic więcej nie potrzebuje.
platform_toolsets:
  telegram: [memory]
  cron: [memory]
  cli: [memory]

# --- Pamięć wbudowana (USER.md + MEMORY.md, wstrzykiwane do promptu). --------
# Lekko podniesione limity, bo zbieranie wiedzy o userze to rdzeń produktu.
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 3000           # ~1.1k tok — obietnice, wzorce, wątki
  user_char_limit: 2500             # ~0.9k tok — profil usera

# --- Rozmowa na Telegramie nie wygasa sama. ---------------------------------
# Bez tego historia rośnie do 256k tokenów zanim Hermes ją skompresuje,
# a każda wiadomość wysyła CAŁĄ historię. To zjadało limit po 2-3 wiadomościach.
compression:
  enabled: true
  threshold_tokens: 16000           # kompresuj, gdy kontekst > ~16k tok
  protect_last_n: 12                # zostaw ostatnie ~6 wymian dosłownie
  idle_compact_after_seconds: 3600  # po godzinie ciszy — zwiń historię przed odpowiedzią

# Cache promptu: rozmowy z przerwami > 5 min, więc 1h się opłaca.
prompt_caching:
  cache_ttl: "1h"

auxiliary:
  # Streszczanie historii — tani model wystarczy.
  compression:
    provider: anthropic
    model: claude-haiku-4-5
  # "Self-improvement review" odpala po turach osobne wywołanie z CAŁĄ rozmową
  # (limit domyślny: do 120k+ tokenów na jeden przegląd). Bibo zapisuje pamięć
  # sam w trakcie rozmowy (SOUL.md), więc wyłączamy.
  background_review:
    enabled: false

# Kurator skilli — Bibo nie ma skilli do kuratorowania.
curator:
  enabled: false

display:
  memory_notifications: off         # bez "💾 Memory updated" w czacie

# Proaktywne wiadomości (cron) — odpowiedź na zaczepkę Bibo trafia
# do tej samej rozmowy, więc Bibo wie, na co odpisujesz.
cron:
  mirror_delivery: true
  wrap_response: false              # bez nagłówka "Cron job ..." — ma brzmieć jak wiadomość
