name: bibo-clean-output
version: "1.0.0"
description: "Strip Bibo's internal thoughts from LLM output before it reaches the user. Reads debug_mode flag from /opt/data/hi-bibo/brain.json — when false (production) keeps only the message up to and including the first ',bibo' terminator; when true (testing) passes the full response through untouched. Cut thoughts are appended to /opt/data/hi-bibo/logs/thoughts.log with a timestamp so nothing is lost."
author: "Kamil Bandzwołek"
hooks:
  - transform_llm_output
  - post_tool_call
