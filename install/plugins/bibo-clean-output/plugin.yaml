name: bibo-clean-output
version: "1.1.0"
description: "Bibo profile plugin: (1) strip Bibo's internal thoughts from LLM output before it reaches the user, controlled by debug_mode in /opt/data/hi-bibo/brain.json; (2) enforce brain.json schema after every write by patching missing top-level keys from brain.template.json; (3) expose /bibo-profile slash command showing the agent's self-state (phase, breath count, character params, what forms worked). Scoped to the bibo profile only."
author: "Kamil Bandzwołek"
hooks:
  - transform_llm_output
  - post_tool_call
